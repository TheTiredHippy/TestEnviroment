<!doctype html>
<html>
<head>
  <title>Email Signup</title>
  <link rel="stylesheet" href="../styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Aladin&display=swap" rel="stylesheet">
</head>

<body>

<header class="topbar">
  <img src="../banner.png" class="banner">
</header>

<nav>
  <a href="../index.html">Home</a>
  <a href="../FindMeAtTheseEvents/">Live Events</a>
  <a href="../NewsAndSales/">News, Drops & Sales</a>
  <a href="../EmailListSignup/" class="active">Email List Signup</a>
</nav>

<div class="container">

  <div class="card">
    <h2>Join the list</h2>
    <p>Get updates on drops, festival locations, and sales!</p>

    <form>

      <!-- Required info -->
      <input type="text" name="name" placeholder="Preferred Name" required>
      <br>
      <input type="email" name="email" placeholder="Email" required>
      <br>

      <!-- Optional location -->
      <input type="text" name="city" placeholder="City (optional)">
      <br>

      <!-- Interests -->
      <p class="interest-title">What would you like updates about?</p>
      <label>
        <input type="checkbox" name="interests" value="drops">
        Product drops
      </label>
      <br>

      <label>
        <input type="checkbox" name="interests" value="events">
        Festival locations
      </label>
      <br>

      <label>
        <input type="checkbox" name="interests" value="sales">
        Sales & Discounts
      </label>

      <br><br>

      <button type="submit">Sign Up!</button>

    </form>

  </div>

</div>

</body>
</html>
</html>
