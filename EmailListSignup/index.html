<!doctype html>
<html>
<head>
  <title>Email Signup</title>
  <link rel="stylesheet" href="../styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Aladin&display=swap" rel="stylesheet">
</head>

<body>

<header class="topbar">
  <img src="../banner.png" class="banner">
</header>

<nav>
  <a href="../index.html">Home</a>
  <a href="../FindMeAtTheseEvents/">Live Events</a>
  <a href="../NewsAndSales/">News, Drops & Sales</a>
  <a href="../EmailListSignup/" class="active">Email List Signup</a>
</nav>

<div class="container">

  <div class="card">
    <h2>Join The Email List</h2>
    <p>Get updates on Drops, Festival Locations, and Sales!</p>

    <form id="signup-form"
          action="https://script.google.com/u/0/home/projects/1n-HFs7_Ci9ZoWolSdiyGoOsedX4YLlDork7sBM5rUHemtNdqOMwp00Ie/edit"
          method="POST"
          target="hidden_iframe">

      <input type="text" name="name" placeholder="Preferred Name" required>
      <br>

      <input type="email" name="email" placeholder="Email" required>
      <br>

      <input type="text" name="city" placeholder="City (optional)">
      <br><br>

      <button type="submit">Submit!</button>

    </form>

    <p id="success-message" style="display:none; color:green; font-weight:bold;">
      Thanks! You’re on the list.
    </p>

    <iframe name="hidden_iframe" style="display:none;"></iframe>

  </div>

</div>

<script>
  const form = document.getElementById("signup-form");
  const message = document.getElementById("success-message");

  form.addEventListener("submit", function () {
    message.style.display = "block";
    form.reset();
  });
</script>

</body>
</html>
