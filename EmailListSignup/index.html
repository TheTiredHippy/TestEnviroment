<!doctype html>
<html>
<head>
  <title>Email Signup</title>
  <link rel="stylesheet" href="../styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Aladin&display=swap" rel="stylesheet">
</head>

<body>

<header class="topbar">
  <img src="../banner.png" class="banner">
</header>

<nav>
  <a href="../index.html">Home</a>
  <a href="../FindMeAtTheseEvents/">Live Events</a>
  <a href="../NewsAndSales/">News, Drops & Sales</a>
  <a href="../EmailListSignup/" class="active">Email List Signup</a>
</nav>

<div class="container">

  <div class="card">
    <h2>Join the list</h2>
    <p>Get updates on drops, festivals, and new items.</p>

    <form>

      <!-- Basic Info -->
      <input type="text" name="name" placeholder="Preferred Name" required>
      <br>
      <input type="email" name="email" placeholder="Email" required>
      <br>

      <!-- Location -->
      <input type="text" name="city" placeholder="City (optional)">
      <br>

      <select name="region">
        <option value="">Select Region (optional)</option>
        <option value="western_wa">Western WA</option>
        <option value="eastern_wa">Eastern WA</option>
        <option value="out_of_state">Out of State</option>
      </select>
      <br><br>

      <!-- Interests -->
      <label>
        <input type="checkbox" name="interests" value="drops">
        Product drops
      </label><br>

      <label>
        <input type="checkbox" name="interests" value="events">
        Festival locations
      </label><br>

      <label>
        <input type="checkbox" name="interests" value="wholesale">
        Wholesale updates
      </label>

      <br><br>

      <!-- Referral -->
      <select name="referral">
        <option value="">How did you find me? (optional)</option>
        <option value="festival">Festival</option>
        <option value="instagram">Instagram</option>
        <option value="friend">Friend</option>
        <option value="online">Online</option>
      </select>

      <br><br>

      <!-- Notes -->
      <textarea name="notes" placeholder="Anything you'd like me to know (optional)"></textarea>

      <br><br>

      <button type="submit">Sign Up!</button>

    </form>
  </div>

</div>

</body>
</html>
