<!doctype html>
<html>
<head>
  <title>Email Signup</title>
  <link rel="stylesheet" href="../styles.css">
</head>

<body>

<h2>Join The Email List</h2>
<p>Get updates on drops, events, and sales.</p>

<form id="signup-form"
      action="https://script.google.com/macros/s/AKfycbxo5Z02Dhn0YdgDGOPua2bGkcOJ2nlVmxQm7GjsYEbKS24J76D5GBy9UTJk8BohaBIvtw/exec"
      method="POST"
      target="hidden_iframe">

  <input type="text" name="name" placeholder="Name" required>
  <br>

  <input type="email" name="email" placeholder="Email" required>
  <br>

  <input type="text" name="city" placeholder="City (optional)">
  <br><br>

  <button type="submit">Sign Up</button>

</form>

<p id="success" style="display:none; color:green; font-weight:bold;">
  Thanks! You’re on the list.
</p>

<iframe name="hidden_iframe" style="display:none;"></iframe>

<script>
  const form = document.getElementById("signup-form");
  const success = document.getElementById("success");

  form.addEventListener("submit", function () {
    setTimeout(() => {
      success.style.display = "block";
      form.reset();
    }, 300);
  });
</script>

</body>
</html>
